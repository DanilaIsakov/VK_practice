# Конфигурация LoRA instruction tuning для RuVLM

model_name_or_path: deepvk/llava-gemma-2b-lora
output_dir: outputs/ruvlm-gemma-2b-lora

# Данные
llava_instruct_dataset: deepvk/LLaVA-Instruct-ru
gqa_dataset: deepvk/GQA-ru
gqa_post_prompt: " Ответь одним словом."
# Для отладки на CPU/малой GPU поставьте небольшое число; null = весь датасет
max_samples: 2000
seed: 42

# LoRA
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Обучение
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
warmup_ratio: 0.03
weight_decay: 0.0
lr_scheduler_type: cosine
logging_steps: 10
save_steps: 200
save_total_limit: 2
bf16: true
fp16: false
gradient_checkpointing: true
dataloader_num_workers: 2
max_seq_length: 2048
report_to: none

# Память: true = загрузить LLM в 4-bit (QLoRA)
load_in_4bit: false
